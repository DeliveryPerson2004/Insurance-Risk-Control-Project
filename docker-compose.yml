services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fraud_detect
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/fraud_detect
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-change-in-production
      JWT_ALGORITHM: HS256
      CORS_ORIGINS: '["http://localhost:5173"]'
      MODEL_PATH: /app/modeling/xgb_fraud_model.pkl
    ports:
      - "8000:8000"
    volumes:
      - ./modeling:/app/modeling:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uv run celery -A backend.app.tasks.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/fraud_detect
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-change-in-production
      JWT_ALGORITHM: HS256
      MODEL_PATH: /app/modeling/xgb_fraud_model.pkl
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./modeling:/app/modeling:ro

  # 开发期: 前端使用 Vite dev server (localhost:5173) + proxy → backend。
  # 生产部署: 取消注释下方 volumes，执行 cd frontend && npm run build 后重启。
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
