[project]
name = "insurance-fraud-detection"
version = "0.4.0"
description = "医疗保险理赔欺诈检测系统"
requires-python = ">=3.10"
# 所有依赖由 [dependency-groups] 管理，uv sync --group ml --group web
dependencies = []

[dependency-groups]
ml = [
    "pandas>=2.0",
    "numpy>=1.24",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "optuna>=3.0",
    "shap>=0.44",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "joblib>=1.3",
    "openpyxl>=3.1",
    "imbalanced-learn>=0.11",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "bcrypt>=4.0,<6.0",
    "python-jose[cryptography]>=3.3.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.0",
    "httpx>=0.27.0",
    "email-validator>=2.1.0",
]
